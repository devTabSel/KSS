[project]
name = "kss"
version = "0.1.0"
description = "KNX Semantic Server"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "python-multipart",
    "xknxproject",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.uv.sources]
xknxproject = { path = "../xknxproject", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src", "../xknxproject"]
